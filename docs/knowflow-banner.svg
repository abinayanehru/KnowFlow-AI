<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">KnowFlow AI — Enterprise Knowledge Assistant</title>
<desc id="desc">A local-first Agentic RAG knowledge assistant architecture, from uploaded documents through LangGraph and ChromaDB to evidence-backed answers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d25"/><stop offset=".55" stop-color="#11113c"/><stop offset="1" stop-color="#080d20"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54e7ff"/><stop offset="1" stop-color="#537bff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c17aff"/><stop offset="1" stop-color="#6259ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#5366bb" stroke-opacity=".13" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="560" rx="28" fill="url(#bg)"/>
