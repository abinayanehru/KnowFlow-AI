  <text x="124" y="112" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#b8a0ff" letter-spacing="4">ENTERPRISE KNOWLEDGE ASSISTANT</text>
  <text x="0" y="188" font-family="Inter,Arial,sans-serif" font-size="26" fill="#dce5ff">Turn organizational documents into useful,</text>
  <text x="0" y="226" font-family="Inter,Arial,sans-serif" font-size="26" fill="#dce5ff">context-aware answers grounded in sources.</text>
